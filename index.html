<!doctype html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sweet Miles Club</title>
<meta name="description" content="Sweet Miles Club — prostor za sebe unutar stvarnog života.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF6F0;
    --linen:#F1ECE3;
    --clay:#C4826A;
    --clay-soft:#EADAD2;
    --eucalyptus:#9DAB92;
    --eucalyptus-soft:#E4E9E0;
    --blush:#F3DCD3;
    --asphalt:#3F3B36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ivory);
    color:var(--asphalt);
    font-family:'Poppins',sans-serif;
    font-weight:300;
    line-height:1.7;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 28px;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:560px;text-align:center;}
  .logo .smc{
    display:block;
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:9px;
    color:var(--asphalt);
  }
  .logo .full{
    display:block;
    font-weight:500;
    font-size:10px;
    letter-spacing:4px;
    color:var(--clay);
    margin-top:8px;
  }
  .rule{
    width:48px;
    height:1px;
    background:var(--clay-soft);
    margin:38px auto;
  }
  .lead{
    font-size:17px;
    color:#5b564f;
    margin:0 0 40px;
  }
  .links{
    display:flex;
    gap:34px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .links a{
    font-size:14px;
    letter-spacing:.5px;
    padding-bottom:5px;
    border-bottom:1px solid var(--clay-soft);
    transition:color .25s ease, border-color .25s ease;
  }
  .links a:hover{color:var(--clay);border-bottom-color:var(--clay);}
  .signature{
    font-family:'Caveat',cursive;
    font-size:22px;
    color:var(--clay);
    margin-top:56px;
  }
  @media (max-width:520px){
    .logo .smc{font-size:28px;letter-spacing:7px;}
    .lead{font-size:16px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <span class="logo">
    <span class="smc">SMC</span>
    <span class="full">SWEET MILES CLUB</span>
  </span>

  <div class="rule"></div>

  <p class="lead">Prostor za sebe unutar stvarnog života.<br>Stranica se upravo slaže — dio je već tu.</p>

  <div class="links">
    <a href="blog.html">Blog</a>
    <a href="kontakt.html">Kontakt</a>
  </div>

  <div class="signature">mojih 15 minuta &#9825;</div>
</div>

</body>
</html>
